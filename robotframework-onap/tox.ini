[tox]
envlist = pep8,pylint,py3
distdir = {toxinidir}/dist

[testenv]
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
install_command = pip install {opts} {packages}

[testenv:pep8]
basepython = python3
changedir = {toxinidir}
commands =
  flake8 --max-line-length 120 ONAPLibrary vcpeutils

[testenv:pylint]
basepython = python3
deps =
    pyflakes
    pylint
commands =
    pylint -f parseable --ignore-imports=y --disable=locally-disabled --max-line-length 120 --exit-zero -ry ONAPLibrary vcpeutils

[testenv:py3]
basepython = python3
commands = pytest tests/ \
  --junitxml=test-results.xml \
  --cov=ONAPLibrary \
  --cov=vcpeutils \
  --cov-report=xml \
  --cov-report=html
